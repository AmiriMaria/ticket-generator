<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <link rel="icon" href="favicon-32x32.png">
        <title>Conference Ticket Generator</title>
        
    </head>

    <body>
        <section id="ticket-page">

            <img id="logo" src="logo-full.svg" alt="Coding Conf Logo">
            <div >
                <h1 id="heading">
                Congrats,
                <span id="user-name"></span>!
                <br>
                Your ticket is ready.
                </h1>

                <p id="para">
                We've emailed your ticket to
                <span id="user-email"></span>
                and will send updates in the run up to the event.
                </p>
        </div>


        <div class="ticket">

            <div class="ticket-header">
                <img src="logo-full.svg" alt="Logo">
                <p id="date">Aug 31 , 2026   /   Austin, TX</p>
            </div>

            <div id="user-info">

                <img id="user-picture" src="" alt="Avatar">

                <div>
                    <h2 id="ticket-name"></h2>
                    <div>
                        
                        <p id="user-github"></p>
                        <img src="icon-github.svg">
                    </div>
                    
                </div>

            </div>

        </div>
        <div class="pattern"></div>
            <div class="lines"></div>
            <div class="circle-bottom"></div>
            <div class="circle-top"></div>
    </section>

    <script src="script.js"></script>


    </body>
    </html>
