<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <link rel="icon" href="favicon-32x32.png">
        <title>Conference Ticket Generator</title>
        
    </head>

    <body>
        
        <!-- The login page -->
         
         
        <section id="login">
            <!-- the login form -->
             <div id="login-page">
                <img id="logo" src="logo-full.svg">
                <p id="heading"> Your Journey to Coding Conf 2025 Starts Here!</p>
                <p id="paragraph">Secure your spot at next year's biggest coding conference.</p>
                <form id="login-form">

                    <label for="avatar" class="upload-box"  style="font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;color: rgb(238, 231, 242);font-size: 18px;font-weight: 300;">Upload Avatar
                        <img src="icon-upload.svg">
                        <p>drag and drop or click to upload</p>
                    </label>
                    <p id="alerta">Upload your photo (JPG or PNG maxSize: 500kb)</p>
                    <input  id="avatar"  type="file"  required  name="avatar" accept=".png, .jpg, .jpeg">
                    <label for="full-name" style="font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;color:rgb(238, 231, 242);font-size: 18px;font-weight: 300;">Full Name</label>
                    <input id="full-name" type="text" required name="name">
                    <label for="email" style="font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;color: rgb(238, 231, 242);font-size: 18px;font-weight: 300;">Email Address</label>
                    <input id="email" type="email" required name="email" value="example@email.com">
                    <div id="alerte"></div>
                    <label for="gitHub" style="font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;color: rgb(238, 231, 242);font-size: 18px;font-weight: 300;">GitHub Username</label>
                    <input type="text" id="gitHub"  required name="gitHub" value="@yourusername">
                    <button id="generate-tick" onclick="">Generate My Ticket</button>

                
            </form>
            </div>

            <div class="pattern"></div>
            <div class="lines"></div>
            <div class="circle-bottom"></div>
            <div class="circle-top"></div>


        </section>
        <!-- The login page -->
        <script  src="script.js"></script>

    </body>

</html>
